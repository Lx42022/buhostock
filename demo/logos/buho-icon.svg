<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Búho - reduced frontal owl face">
  <!-- Concept 4: Ultra-reduced frontal owl face. Only ears + two eyes as shapes.
       Extremely legible at favicon size. Rounded night-blue square keeps it readable everywhere. -->
  <defs>
    <linearGradient id="g4bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2c6e"/>
      <stop offset="1" stop-color="#14163f"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#g4bg)"/>

  <!-- Ears: two bold triangles integrated with the head -->
  <path d="M96 250
           C96 150 176 96 256 96
           C336 96 416 150 416 250
           C416 372 336 440 256 440
           C176 440 96 372 96 250 Z" fill="#0b0d2b"/>
  <path d="M120 210 L150 110 L214 176 Z" fill="#0b0d2b"/>
  <path d="M392 210 L362 110 L298 176 Z" fill="#0b0d2b"/>

  <!-- The two big amber eyes (the signature) -->
  <circle cx="192" cy="252" r="66" fill="#ffc93c"/>
  <circle cx="320" cy="252" r="66" fill="#ffc93c"/>
  <circle cx="192" cy="252" r="30" fill="#0b0d2b"/>
  <circle cx="320" cy="252" r="30" fill="#0b0d2b"/>
  <circle cx="203" cy="240" r="10" fill="#f5f3ec"/>
  <circle cx="331" cy="240" r="10" fill="#f5f3ec"/>

  <!-- Minimal beak between the eyes -->
  <path d="M256 262 L240 288 L256 306 L272 288 Z" fill="#f5b301"/>
</svg>
