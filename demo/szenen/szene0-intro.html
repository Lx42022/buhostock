<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Búho — Escena 0: Intro</title>
<link rel="stylesheet" href="_estilo.css">
<style>
  /* Scene 0: title card. Icon (#4) + wordmark + tagline fade in one by one. ~8s. */
  .introWrap{display:flex;flex-direction:column;align-items:center;gap:24px;text-align:center;}
  .hero{width:220px;height:220px;border-radius:56px;opacity:0;transform:scale(.7);
    filter:drop-shadow(0 0 34px rgba(255,201,60,.55));
    transition:opacity .9s ease,transform .9s cubic-bezier(.2,.9,.3,1.2);}
  .hero.in{opacity:1;transform:scale(1);}
  .word{font-size:96px;font-weight:800;letter-spacing:1px;opacity:0;transform:translateY(18px);
    transition:opacity .8s ease,transform .8s ease;}
  .word b{color:var(--amber);}
  .tag{font-size:32px;color:var(--muted);font-style:italic;opacity:0;transition:opacity .8s ease;}
  .tag.in{opacity:1;}
  .word.in{opacity:1;transform:translateY(0);}
</style>
</head>
<body>
<div id="stage">
  <div id="stars"></div>

  <div class="introWrap">
    <img class="hero" src="../logos/buho-icon.svg" alt="Búho">
    <div class="word"><b>Búho</b></div>
    <div class="tag">El búho trabaja mientras duermes.</div>
  </div>

  <button id="replay" title="Wiederholen">↻</button>
  <div id="startScreen">
    <img class="ss-owl" src="../logos/buho-icon.svg" alt="">
    <div class="ss-title"><b>Búho</b></div>
    <div class="ss-sub">Escena 0 · <span>Intro</span></div>
    <button id="startBtn">▶ Empezar</button>
    <div class="ss-hint">F11 = Vollbild · mit Win+G aufnehmen · dann „Empezar"</div>
  </div>
</div>

<script>
let timers=[];
function buildStars(){const b=document.getElementById("stars");let s="";for(let i=0;i<40;i++){const x=Math.random()*100,y=Math.random()*72,d=(Math.random()*3).toFixed(1);s+=`<div class="star" style="left:${x}vw;top:${y}vh;animation-delay:${d}s"></div>`;}b.innerHTML=s;}
function at(sec,fn){timers.push(setTimeout(fn,sec*1000));}
function startScene(){document.getElementById("startScreen").style.display="none";document.getElementById("replay").style.display="flex";run();}
function reset(){timers.forEach(clearTimeout);timers=[];resetScene();run();}

const hero=document.querySelector(".hero"),word=document.querySelector(".word"),tag=document.querySelector(".tag");
function initScene(){}
function resetScene(){[hero,word,tag].forEach(e=>e.classList.remove("in"));}
function run(){
  at(0.2,()=>hero.classList.add("in"));
  at(1.5,()=>word.classList.add("in"));
  at(2.7,()=>tag.classList.add("in"));
}
buildStars();initScene();
document.getElementById("startBtn").addEventListener("click",startScene);
document.getElementById("replay").addEventListener("click",reset);
</script>
</body>
</html>

<!-- Web control (solo copia web): velocidad (spd) + voz opcional. Original ver1.1 intacto. -->
<style>#startScreen{display:none!important}.ss-hint{display:none!important}#replay{display:none!important}</style>
<script>
  window.addEventListener("load", function () {
    var q = new URLSearchParams(location.search);
    var spd = parseFloat(q.get("spd")); if (!(spd > 0)) spd = 1;
    var voz = q.get("voz") === "1";

    // Velocidad: escalar todos los pasos programados.
    try { at = function (sec, fn) { timers.push(setTimeout(fn, sec * 1000 * spd)); }; } catch (e) {}

    // Voz: leer cada linea de subtitulo en espanol (Web Speech API, gratis).
    if (voz && "speechSynthesis" in window) {
      try {
        var _origSet = setSubtitle;
        setSubtitle = function (t) {
          _origSet(t);
          try {
            var u = new SpeechSynthesisUtterance(t);
            u.lang = "es-ES"; u.rate = 1;
            var vs = window.speechSynthesis.getVoices() || [];
            for (var i = 0; i < vs.length; i++) { if (/es[-_]/i.test(vs[i].lang)) { u.voice = vs[i]; break; } }
            window.speechSynthesis.speak(u);
          } catch (e) {}
        };
      } catch (e) {}
    }

    var b = document.getElementById("startBtn");
    if (b) { b.click(); } else if (typeof startScene === "function") { startScene(); }
  });
</script>
