<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Búho · Demo (2 min)</title>
  <link rel="icon" href="demo/logos/buho-icon.svg" />
  <style>
    :root {
      --night-1: #0b0d2b; --night-2: #14163f; --amber: #ffc93c;
      --amber-2: #f5b301; --cream: #f5f3ec; --muted: #9aa0d0;
      --border: rgba(154, 160, 208, 0.28);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: var(--night-1); color: var(--cream);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      overflow: hidden;
    }
    /* Dynamic viewport height on mobile: prevents the browser address bar from
       squeezing the stage, which made the video tiny on phones. */
    html, body { height: 100dvh; }
    body { display: flex; flex-direction: column; }
    a { color: inherit; text-decoration: none; }

    /* ---- Barra superior ---- */
    .topbar {
      display: flex; align-items: center; gap: 16px;
      padding: 12px 20px; border-bottom: 1px solid var(--border);
      background: var(--night-2);
    }
    .topbar__brand { display: flex; align-items: center; gap: 10px; margin: 0 auto 0 4px; }
    .topbar__brand img { height: 30px; }
    .topbar__tag { color: var(--muted); font-size: 0.9rem; }
    .back {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border);
      font-size: 0.9rem; color: var(--cream); background: rgba(255,255,255,.03);
    }
    .back:hover { background: rgba(255,255,255,.08); }

    /* ---- Escenario (mantiene 16:9 y escala el iframe de 1080p) ---- */
    .stage-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 18px; min-height: 0; }
    .stage {
      position: relative; overflow: hidden; border-radius: 14px;
      box-shadow: 0 30px 80px rgba(0,0,0,.55); border: 1px solid var(--border);
      background: var(--night-1);
    }
    /* El iframe se renderiza SIEMPRE a 1920x1080 y se escala en bloque -> nitidez perfecta */
    #frame {
      position: absolute; top: 0; left: 0;
      width: 1920px; height: 1080px; border: 0;
      transform-origin: top left;
    }

    /* ---- Controles ---- */
    .controls {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      padding: 14px 20px 18px; flex-wrap: wrap;
    }
    .ctrl {
      display: inline-flex; align-items: center; justify-content: center;
      width: 46px; height: 46px; border-radius: 50%;
      background: rgba(255,255,255,.05); border: 1px solid var(--border);
      color: var(--cream); font-size: 1.1rem; cursor: pointer;
    }
    .ctrl:hover { background: rgba(255,255,255,.1); }
    .ctrl--play { width: 54px; height: 54px; font-size: 1.3rem;
      background: linear-gradient(180deg, var(--amber), var(--amber-2));
      color: var(--night-1); border: none; box-shadow: 0 10px 26px rgba(255,201,60,.32); }
    .label { min-width: 220px; text-align: center; font-size: 0.95rem; }
    .label b { color: var(--amber); }
    .dots { display: flex; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(154,160,208,.35);
      cursor: pointer; border: none; padding: 0; }
    .dot.on { background: var(--amber); transform: scale(1.15); }

    /* ---- Puerta PIN ---- */
    .pin-gate { position: fixed; inset: 0; z-index: 9999; background: var(--night-1);
      display: flex; align-items: center; justify-content: center; padding: 22px; }
    .pin-gate__box { background: var(--night-2); border: 1px solid var(--border);
      border-radius: 16px; padding: 38px 30px; max-width: 360px; width: 100%; text-align: center; }
    .pin-gate__owl { width: 64px; height: 64px; margin: 0 auto 10px; display: block; }
    .pin-gate h1 { font-size: 1.4rem; margin-bottom: 6px; }
    .pin-gate p { color: var(--muted); margin-bottom: 18px; }
    .pin-gate form { display: flex; flex-direction: column; gap: 12px; }
    .pin-gate input { padding: 13px 16px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--night-1); color: var(--cream); font-size: 1.05rem; text-align: center;
      letter-spacing: 0.12em; outline: none; }
    .pin-gate input:focus { border-color: var(--amber); }
    .pin-gate button { padding: 13px 22px; border-radius: 999px; border: none;
      background: var(--amber); color: var(--night-1); font-weight: 700; font-size: 1rem; cursor: pointer; }
    .pin-gate__error { color: #ff8080; font-size: 0.9rem; margin: 4px 0 0; }

    @media (max-width: 620px) {
      .label { min-width: 0; width: 100%; order: -1; }
      /* Give the video as much room as possible on phones. */
      .topbar { padding: 8px 12px; }
      .topbar__tag { display: none; }
      .stage-wrap { padding: 8px; }
      .controls { gap: 10px; padding: 10px 12px 12px; }
    }
  </style>
</head>
<body>

  <!-- ============ PUERTA DE ACCESO (PIN) ============ -->
  <div class="pin-gate" id="pinGate">
    <div class="pin-gate__box">
      <img class="pin-gate__owl" src="demo/logos/buho-icon.svg" alt="" />
      <h1>Acceso privado</h1>
      <p>Introduce el PIN para ver la demo.</p>
      <form id="pinForm" autocomplete="off">
        <input type="password" id="pinInput" name="pin" placeholder="PIN"
               autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="PIN de acceso" />
        <button type="submit">Entrar</button>
      </form>
      <p class="pin-gate__error" id="pinError" hidden>PIN incorrecto</p>
    </div>
  </div>

  <!-- ============ BARRA SUPERIOR ============ -->
  <header class="topbar">
    <a class="back" href="index.html">← Volver a la web</a>
    <span class="topbar__brand">
      <img src="demo/logos/buho-lockup.svg" alt="Búho / BuhoStock" />
    </span>
    <span class="topbar__tag">Demo · 2 min</span>
  </header>

  <!-- ============ ESCENARIO ============ -->
  <div class="stage-wrap" id="stageWrap">
    <div class="stage" id="stage">
      <iframe id="frame" title="Demo Búho" scrolling="no"></iframe>
    </div>
  </div>

  <!-- ============ CONTROLES ============ -->
  <div class="controls">
    <button class="ctrl" id="prevBtn" title="Anterior" aria-label="Anterior">◀</button>
    <button class="ctrl ctrl--play" id="playBtn" title="Play/Pausa" aria-label="Play/Pausa">⏸</button>
    <button class="ctrl" id="nextBtn" title="Siguiente" aria-label="Siguiente">▶</button>
    <button class="ctrl" id="vozBtn" title="Voz" style="width:auto;padding:0 16px;">🔇 Sin voz</button>
    <span class="label" id="label"></span>
    <span class="dots" id="dots"></span>
  </div>

  <script>
    /* ---------------------------------------------------------------------
       Reproductor de la demo: encadena las 6 escenas HTML como si fuera un
       vídeo. Cada escena arranca sola (autoplay inyectado) y avanzamos con
       un temporizador según su duración aproximada.
       --------------------------------------------------------------------- */
    var SCENES = [
      { f: "demo/szenen/szene0-intro.html",         d: 9,  n: "Intro" },
      { f: "demo/szenen/szene1-catalogo.html",      d: 31, n: "Tu catálogo" },
      { f: "demo/szenen/szene2-noche.html",         d: 33, n: "El búho de noche" },
      { f: "demo/szenen/szene3-telegram.html",      d: 31, n: "Informe cada mañana" },
      { f: "demo/szenen/szene4-antes-despues.html", d: 19, n: "Antes / Después" },
      { f: "demo/szenen/szene5-outro.html",         d: 7,  n: "¿Hablamos?" }
    ];

    var frame = document.getElementById("frame");
    var label = document.getElementById("label");
    var dotsEl = document.getElementById("dots");
    var playBtn = document.getElementById("playBtn");
    var stage = document.getElementById("stage");
    var stageWrap = document.getElementById("stageWrap");

    var idx = 0;
    var playing = true;
    var timer = null;
    var SPEED = 0.6;   // < 1 = más rápido (misma cifra que el reproductor de la portada)
    var voz = false;   // narración por voz (Web Speech), desactivada por defecto
    function urlFor(i) { return SCENES[i].f + "?spd=" + SPEED + (voz ? "&voz=1" : ""); }
    // Track remaining time for true pause/resume (no iframe reload on play).
    var sceneStart = 0, sceneRemaining = 0;
    // Helper to send postMessage commands to the scene iframe.
    function post(t) { try { frame.contentWindow.postMessage({ type: t }, "*"); } catch (e) {} }

    // Crear los puntos (dots) de navegación.
    SCENES.forEach(function (s, i) {
      var b = document.createElement("button");
      b.className = "dot"; b.title = s.n;
      b.addEventListener("click", function () { goTo(i); });
      dotsEl.appendChild(b);
    });

    function updateUI() {
      label.innerHTML = "Escena <b>" + (idx + 1) + "/" + SCENES.length + "</b> · " + SCENES[idx].n;
      var dots = dotsEl.children;
      for (var i = 0; i < dots.length; i++) dots[i].className = "dot" + (i === idx ? " on" : "");
      playBtn.textContent = playing ? "⏸" : "▶";
    }

    function clearTimer() { if (timer) { clearTimeout(timer); timer = null; } }

    // Schedule the jump to the next scene (only if playing).
    // BUG 1 FIX: Now also tracks sceneStart + sceneRemaining so we can pause mid-scene.
    function schedule() {
      clearTimer();
      if (!playing) return;
      sceneStart = Date.now();
      sceneRemaining = SCENES[idx].d * SPEED * 1000;
      timer = setTimeout(function () {
        if (idx < SCENES.length - 1) { goTo(idx + 1); }
        else { playing = false; updateUI(); }   // end of demo: stop
      }, sceneRemaining);
    }

    // Load a scene. Cancel any ongoing speech first to avoid overlapping audio.
    function goTo(i) {
      try { window.speechSynthesis.cancel(); } catch (e) {}
      idx = (i + SCENES.length) % SCENES.length;
      frame.src = urlFor(idx);   // reload = animation restarts (with speed/voz params)
      updateUI();
    }

    frame.addEventListener("load", schedule);

    // BUG 1 FIX: Pause sends postMessage to freeze the iframe; resume continues exactly
    // where paused (no reload). Only restarts from scene 0 if the demo had fully ended.
    playBtn.addEventListener("click", function () {
      if (playing) {
        playing = false;
        // Save remaining time for this scene.
        if (timer) { clearTimeout(timer); timer = null; sceneRemaining -= (Date.now() - sceneStart); }
        post("buho-pause");   // freeze scene's internal timers + CSS animations
        if (voz) { try { window.speechSynthesis.pause(); } catch (e) {} }
        updateUI();
      } else {
        playing = true;
        if (idx === SCENES.length - 1 && sceneRemaining <= 0) {
          // Demo had finished completely -> restart from scene 0.
          idx = 0; frame.src = urlFor(idx); updateUI();
        } else {
          post("buho-resume");  // unfreeze scene
          if (voz) { try { window.speechSynthesis.resume(); } catch (e) {} }
          // Resume outer timer from the remaining duration.
          sceneStart = Date.now();
          timer = setTimeout(function () {
            if (idx < SCENES.length - 1) { goTo(idx + 1); } else { playing = false; updateUI(); }
          }, Math.max(0, sceneRemaining));
          updateUI();
        }
      }
    });
    document.getElementById("prevBtn").addEventListener("click", function () { goTo(idx - 1); });
    document.getElementById("nextBtn").addEventListener("click", function () { goTo(idx + 1); });
    // BUG 2 FIX: Warm-up speak() inside the button's user gesture to unlock audio on mobile.
    document.getElementById("vozBtn").addEventListener("click", function () {
      voz = !voz;
      this.textContent = voz ? "🔊 Con voz" : "🔇 Sin voz";
      try {
        window.speechSynthesis.cancel();
        if (voz) {
          // Silent warm-up utterance inside user gesture -> unlocks audio on iOS/Android.
          var warm = new SpeechSynthesisUtterance(" "); warm.volume = 0;
          window.speechSynthesis.speak(warm);
        }
      } catch (e) {}
      goTo(idx);   // reload to pass the ?voz=1 flag to the scene
    });

    // Cache the best Spanish voice. Voices load asynchronously (often empty on the
    // first call, especially on mobile), so we refresh the pick when the browser
    // fires "voiceschanged". Preferring "Google es-ES" makes the mobile voice match
    // the higher-quality desktop Chrome voice instead of the robotic system default.
    var _bestVoice = null;
    function buhoPickVoice() {
      var vs = window.speechSynthesis.getVoices() || [];
      var es = vs.filter(function (v) { return /^es([-_]|$)/i.test(v.lang); });
      if (!es.length) { _bestVoice = null; return; }
      var prefs = [
        function (v) { return /google/i.test(v.name) && /es[-_]es/i.test(v.lang); }, // = desktop Chrome
        function (v) { return /google/i.test(v.name); },
        function (v) { return /microsoft/i.test(v.name) && /es[-_]es/i.test(v.lang); },
        function (v) { return /es[-_]es/i.test(v.lang); },                            // Spain Spanish
        function () { return true; }
      ];
      for (var p = 0; p < prefs.length; p++) { var m = es.filter(prefs[p]); if (m.length) { _bestVoice = m[0]; return; } }
      _bestVoice = es[0];
    }
    try { buhoPickVoice(); window.speechSynthesis.onvoiceschanged = buhoPickVoice; } catch (e) {}

    // BUG 2 FIX: Receive subtitle text from the scene iframe and speak it here (parent page),
    // where the original user gesture (vozBtn click) already unlocked the audio context.
    window.addEventListener("message", function (e) {
      var d = e.data || {};
      if (d.type === "buho-say" && voz) {
        try {
          if (!_bestVoice) buhoPickVoice();   // last-chance pick if voices just arrived
          var u = new SpeechSynthesisUtterance(d.text);
          u.lang = "es-ES"; u.rate = 1; u.pitch = 1;
          if (_bestVoice) u.voice = _bestVoice;
          window.speechSynthesis.speak(u);
        } catch (e2) {}
      }
    });

    // ---- Scale the 1920x1080 iframe to fit while keeping 16:9 ----
    // Padding is read live so it also works with the compact mobile layout.
    function fitStage() {
      var cs = getComputedStyle(stageWrap);
      var padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
      var padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
      var availW = stageWrap.clientWidth - padX;
      var availH = stageWrap.clientHeight - padY;
      var w = Math.min(availW, availH * 16 / 9);
      if (w < 200) w = 200;
      var h = w * 9 / 16;
      stage.style.width = w + "px";
      stage.style.height = h + "px";
      frame.style.transform = "scale(" + (w / 1920) + ")";
    }
    // ResizeObserver reacts to ANY container size change (rotation, mobile toolbar,
    // fullscreen) — iOS Safari fires "resize"/"orientationchange" unreliably, which is
    // why the video did not resize on mobile/landscape before.
    if (window.ResizeObserver) { new ResizeObserver(fitStage).observe(stageWrap); }
    else { window.addEventListener("resize", fitStage); }
    window.addEventListener("orientationchange", function () { setTimeout(fitStage, 250); });

    // ---- Puerta PIN (mismo esquema que la web principal) ----
    (function () {
      var PIN_HASH = "b62ae2df8a426804bc7c58955ceeb977e240a0727ae0018eb62a6c637ab5b135";
      var gate = document.getElementById("pinGate");
      function boot() { fitStage(); goTo(0); }   // arrancar el reproductor
      if (sessionStorage.getItem("buho_ok") === "1") { gate.remove(); boot(); return; }
      var form = document.getElementById("pinForm");
      var input = document.getElementById("pinInput");
      var error = document.getElementById("pinError");
      async function sha256Hex(text) {
        var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
        return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
      }
      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        var hash = await sha256Hex((input.value || "").trim().toUpperCase());
        if (hash === PIN_HASH) { sessionStorage.setItem("buho_ok", "1"); gate.remove(); boot(); }
        else { error.hidden = false; input.value = ""; input.focus(); }
      });
      input.focus();
    })();
  </script>
</body>
</html>
